<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="format-detection" content="telephone=no,email=no,address=no" />
<meta name="referrer" content="never" />
<title>正在进入…</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(168deg, #0a0f1a 0%, #152238 42%, #0c1220 100%);
    color: #f8fafc;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden; position: relative;
  }
  /* ── 初始加载态（探活中） ── */
  .loading { text-align: center; }
  .dot {
    width: 44px; height: 44px; margin: 0 auto 18px; border-radius: 50%;
    background: linear-gradient(145deg, #e9c877, #c9a24d);
    box-shadow: 0 10px 32px rgba(201,162,77,.35);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.08);opacity:.85} }
  .loading p { font-size: 15px; letter-spacing: .12em; color: rgba(248,250,252,.85); }

  /* ── 浏览器引导遮罩（微信内且主站被封时显示） ── */
  .guide { position: fixed; inset: 0; background: rgba(2,6,14,.94); display: none; z-index: 10; }
  .guide.show { display: block; }
  .arrow {
    position: absolute; top: 8px; right: 14px; width: 88px; height: 88px;
    animation: bob 1.2s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .guide-body {
    position: absolute; left: 0; right: 0; top: 128px;
    padding: 0 30px; text-align: center;
  }
  .guide-title { font-size: 22px; font-weight: 800; letter-spacing: .06em; margin-bottom: 14px; }
  .guide-title b { color: #f7c948; }
  .step {
    display: flex; align-items: center; gap: 12px; text-align: left;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px; padding: 14px 16px; margin: 12px auto 0; max-width: 340px;
  }
  .step .n {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(145deg,#e9c877,#c9a24d); color: #1b1206;
    font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center;
  }
  .step .txt { font-size: 15px; line-height: 1.5; color: #e8eefb; }
  .step .txt em { color: #f7c948; font-style: normal; font-weight: 700; }
  .hint { margin-top: 22px; font-size: 13px; color: rgba(248,250,252,.55); line-height: 1.6; }
  .copybar {
    margin: 18px auto 0; max-width: 340px;
    display: flex; gap: 8px; align-items: stretch;
  }
  .copybar input {
    flex: 1; min-width: 0; border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.06); color: #cfe0ff; border-radius: 10px;
    padding: 10px 12px; font-size: 12px; font-family: ui-monospace, Menlo, monospace;
  }
  .copybar button {
    flex: none; border: none; border-radius: 10px; padding: 0 16px;
    background: linear-gradient(145deg,#e9c877,#c9a24d); color: #1b1206;
    font-weight: 700; font-size: 14px;
  }

  /* ── 失败兜底（无可用主站域名且非微信，或探活异常） ── */
  .fallback { display: none; text-align: center; padding: 0 28px; }
  .fallback.show { display: block; }
  .fallback .big { font-size: 40px; margin-bottom: 14px; }
  .fallback p { font-size: 15px; color: rgba(248,250,252,.8); line-height: 1.6; }
  .fallback button {
    margin-top: 22px; border: none; border-radius: 999px; padding: 12px 34px;
    background: linear-gradient(145deg,#e9c877,#c9a24d); color: #1b1206;
    font-weight: 800; font-size: 16px;
  }
</style>
</head>
<body>
  <!-- 探活中 -->
  <div class="loading" id="loading">
    <div class="dot"></div>
    <p id="loadingText">正在进入，请稍候…</p>
  </div>

  <!-- 浏览器引导（微信内 + 主站被封） -->
  <div class="guide" id="guide">
    <svg class="arrow" viewBox="0 0 100 100" fill="none">
      <path d="M50 84 L50 26" stroke="#f7c948" stroke-width="8" stroke-linecap="round"/>
      <path d="M28 46 L50 24 L72 46" stroke="#f7c948" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="guide-body">
      <div class="guide-title">请点击右上角 <b>· · ·</b></div>
      <div class="step">
        <div class="n">1</div>
        <div class="txt">点击右上角的 <em>···</em> 菜单按钮</div>
      </div>
      <div class="step">
        <div class="n">2</div>
        <div class="txt">选择 <em>在浏览器打开</em>（Safari / 默认浏览器）</div>
      </div>
      <div class="step">
        <div class="n">3</div>
        <div class="txt">在浏览器中即可正常进入使用</div>
      </div>
      <div class="hint">当前页面在微信中暂时无法访问，<br/>用浏览器打开后会自动登录，进度与账号不丢失。</div>
      <div class="copybar">
        <input id="copyUrl" readonly />
        <button id="copyBtn">复制</button>
      </div>
    </div>
  </div>

  <!-- 兜底：非微信但仍打不开时，给一个手动进入按钮 -->
  <div class="fallback" id="fallback">
    <div class="big">🔗</div>
    <p id="fallbackText">点击下方按钮进入</p>
    <button id="enterBtn">立即进入</button>
  </div>

<script>
(function () {
  "use strict";

  /* ===================== 配置区（部署时按需修改） ===================== */
  /**
   * 主站候选域名列表：探活时逐个尝试，命中第一个可达的即跳转。
   * 与总后台 business_domain / 轮换域名保持一致；被封了就在这里增删。
   * 只填域名（可带 https://，可不带），路径统一跳到 /home。
   */
  var TARGET_DOMAINS = [
    "https://app.fcbhd.top",
    "https://app.fcbhd.top"
  ];
  /** 主站探针图路径（主站 public/probe.png，1×1 透明图，仅用于探活）。 */
  var PROBE_PATH = "/probe.png";
  /** 单个域名探活超时（毫秒）：微信内被封通常直接 error，超时是网络兜底。 */
  var PROBE_TIMEOUT_MS = 3500;
  /* ================================================================== */

  var isWechat = /MicroMessenger/i.test(navigator.userAgent || "");

  /** 透传推广参数：原样保留本页 URL 的全部 query（site/invite 等）。 */
  function currentQuery() {
    var s = window.location.search || "";
    return s && s.charAt(0) === "?" ? s.slice(1) : s;
  }

  /** 规范化域名 → https://host origin。 */
  function normalizeOrigin(raw) {
    var s = String(raw || "").trim().replace(/[\u200B-\u200D\uFEFF]/g, "").replace(/\/+$/, "");
    if (!s) return "";
    if (!/^https?:\/\//i.test(s)) s = "https://" + s;
    try { return new URL(s + "/").origin; } catch (e) { return ""; }
  }

  /** 拼目标落地地址：<origin>/home?<透传query>。 */
  function buildTarget(origin) {
    var q = currentQuery();
    return origin.replace(/\/+$/, "") + "/home" + (q ? "?" + q : "");
  }

  /** 域名池（规范化 + 去空 + 去重）。 */
  var origins = (function () {
    var seen = {}, out = [];
    for (var i = 0; i < TARGET_DOMAINS.length; i++) {
      var o = normalizeOrigin(TARGET_DOMAINS[i]);
      if (o && !seen[o]) { seen[o] = 1; out.push(o); }
    }
    return out;
  })();

  function go(origin) { window.location.replace(buildTarget(origin)); }

  /**
   * 探活单个域名：加载 <origin>/probe.png?cb=时间戳。
   * onload=可达；onerror/超时=不可达（微信封域名时 WebView 会直接 error）。
   */
  function probe(origin) {
    return new Promise(function (resolve) {
      var done = false, img = new Image();
      var timer = setTimeout(function () {
        if (done) return; done = true; img.src = ""; resolve(false);
      }, PROBE_TIMEOUT_MS);
      img.onload = function () { if (done) return; done = true; clearTimeout(timer); resolve(true); };
      img.onerror = function () { if (done) return; done = true; clearTimeout(timer); resolve(false); };
      img.src = origin.replace(/\/+$/, "") + PROBE_PATH + "?cb=" + Date.now() + "_" + Math.random().toString(16).slice(2);
    });
  }

  /** 依次探活，返回第一个可达的 origin；全不可达返回 ""。 */
  function firstReachable() {
    var idx = 0;
    return new Promise(function (resolve) {
      (function next() {
        if (idx >= origins.length) return resolve("");
        var o = origins[idx++];
        probe(o).then(function (ok) { ok ? resolve(o) : next(); });
      })();
    });
  }

  function showGuide() {
    document.getElementById("loading").style.display = "none";
    var g = document.getElementById("guide");
    g.classList.add("show");
    // 复制条：给用户一份「引导页自身」的链接（含推广参数），方便手动粘到浏览器
    var self = window.location.href;
    var inp = document.getElementById("copyUrl");
    inp.value = self;
    document.getElementById("copyBtn").onclick = function () {
      try {
        inp.removeAttribute("readonly"); inp.select();
        inp.setSelectionRange(0, self.length);
        document.execCommand("copy");
        inp.setAttribute("readonly", "readonly");
        this.textContent = "已复制";
        var b = this; setTimeout(function () { b.textContent = "复制"; }, 1500);
      } catch (e) {}
    };
  }

  function showFallback(targetOrigin) {
    document.getElementById("loading").style.display = "none";
    var f = document.getElementById("fallback");
    f.classList.add("show");
    document.getElementById("enterBtn").onclick = function () {
      go(targetOrigin || origins[0]);
    };
  }

  /* ===================== 主流程 ===================== */
  if (!origins.length) {
    document.getElementById("loadingText").textContent = "未配置目标域名";
    return;
  }

  if (!isWechat) {
    /**
     * 浏览器打开：主站在浏览器里不会被微信封 → 直接带参跳转，
     * 落地后由主站 deviceId 自动登录（双模登录）。
     * 仍先探活优选一个可达域名，全不可达再给手动按钮兜底。
     */
    firstReachable().then(function (origin) {
      if (origin) go(origin);
      else showFallback(origins[0]);
    });
    return;
  }

  /**
   * 微信内打开：探活主站候选域名。
   *  - 有可达域名 → 带参跳该域名 → 走微信授权登录（并自动避开被封域名）。
   *  - 全部被封 → 弹浏览器引导遮罩。
   */
  firstReachable().then(function (origin) {
    if (origin) go(origin);
    else showGuide();
  });
})();
</script>
</body>
</html>
